name: twreg-public-ur

# 放在【公开仓库】里跑的入口 —— URnetwork(ur.io) 出口版（feat/urnetwork-egress 分支）
#
# 流程（ur-socks.exe 已在私有仓库预构建为 Release 资产 `ur-socks`，这里直接下载）：
#   prepare : 生成 runner 矩阵
#   reg     : windows runner 下载预编译的 ur-socks.exe → 起 N 条用户态 SOCKS5 出口
#             （每线程一条，自动开 UR 即时账号）→ 跑 ruyijs 注册
#
# 公开仓库的日志与 artifact 是公开的，所以这里：
#   * LOG_MASK=1        —— 日志里的用户名打码
#   * accounts 目录加密  —— 用 secrets.artifact_pass 加密后才上传（未配置则完全不上传）
#
# 需要在公开仓库配置的 secrets：
#   PRIVATE_REPO_ACCESS_KEY 必填，能读私有仓库的 PAT（fine-grained: Contents=Read，放在 Variables）
#   artifact_pass  选填，加密 accounts 的密码（强烈建议配置）
#   UR_CREDENTIALS 选填，手工 UR 账号（每行/逗号分隔 jwt:<jwt> 或 <user>:<pass>）；
#                  留空时脚本会用 UR_AUTO_ACCOUNTS=1 自动开 guest 账号
#
# 拉取的私有仓库与分支（按需修改）：
#   PRIVATE_REPO   xbox-cn/twreg_ruyijs
#   PRIVATE_REF    feat/urnetwork-egress
on:
  workflow_dispatch:
    inputs:
      runners:
        description: "job 数量（每个 job 默认注册 45 个账号，推荐 256）"
        required: false
        default: "1"
      workers:
        description: "线程数（= 每台的 UR 出口数）"
        required: false
        default: "3"
      accounts:
        description: "每个线程注册账号数"
        required: false
        default: "15"
      domain:
        description: "收信域名（*.xxx 表示每次随机子域）"
        required: false
        default: "*.jsip.us"
      ur_locations:
        description: "UR 出口地区池（逗号分隔，按轮换使用）"
        required: false
        default: "United States,Germany,United Kingdom,Canada,France,Netherlands,Japan,Singapore"
      rest_every:
        description: "每注册 N 个账号休息一次（0=不休息）"
        required: false
        default: "0"
      rest_sec:
        description: "每次休息秒数"
        required: false
        default: "600"
      probe_only:
        description: "只建立出口 + 真实 Step1 探活，不注册"
        required: false
        default: "0"
      upload:
        description: "上传账号到服务器: 1=上传 0=只加密上传 artifact"
        required: false
        default: "0"

concurrency:
  group: twreg-public-ur-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          N: ${{ inputs.runners }}
        run: |
          M=$(python3 -c "import json,os;n=max(1,min(256,int(os.environ.get('N') or 1)));print(json.dumps(list(range(n))))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  reg:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 公开日志：用户名打码
      LOG_MASK: "1"
    steps:
      - name: 检出私有仓库代码
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/twreg_ruyijs
          ref: feat/urnetwork-egress
          token: ${{ secrets.PRIVATE_REPO_ACCESS_KEY || vars.PRIVATE_REPO_ACCESS_KEY }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 0.4.x 才支持 socks5h://（0.2.0 在 Windows 上会 NetworkError）
          python -m pip install "ruyijs>=0.4.1"
          python -c "import ruyijs; print('ruyijs', ruyijs.__version__)"

      - name: 下载预编译 ur-socks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_KEY || vars.PRIVATE_REPO_ACCESS_KEY }}
        run: |
          gh release download ur-socks --repo xbox-cn/twreg_ruyijs --pattern ur-socks.exe --output ur-socks.exe --clobber
          ls -lh ur-socks.exe

      - name: 启动 UR 出口（每个 worker 一条）
        shell: bash
        env:
          BIN: ./ur-socks.exe
          UR_INSTANCES: ${{ inputs.workers }}
          UR_LOCATIONS: ${{ inputs.ur_locations }}
          UR_BASE_PORT: "9001"
          UR_AUTO_ACCOUNTS: "1"
          UR_PROBE: "1"
          UR_PROBE_RETRIES: "6"
          UR_CREDENTIALS: ${{ secrets.UR_CREDENTIALS }}
          UR_USER_AUTH: ${{ secrets.UR_USER_AUTH }}
          UR_PASSWORD: ${{ secrets.UR_PASSWORD }}
          UR_JWT: ${{ secrets.UR_JWT }}
        run: |
          chmod +x ur-socks.exe scripts/ur_socks.sh 2>/dev/null || true
          ./scripts/ur_socks.sh start
          echo "EGRESS_LIST=$EGRESS_LIST"

      - name: 注册
        if: ${{ inputs.probe_only != '1' }}
        env:
          WORKERS: ${{ inputs.workers }}
          ACCOUNTS: ${{ inputs.accounts }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL || 'https://mail.minecraft.fashion' }}
          MAIL_DOMAINS: ${{ inputs.domain }}
          ENABLE_UPLOAD: ${{ inputs.upload }}
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'http://192.255.172.250:5000' }}
          API_TOKEN: ${{ secrets.API_TOKEN || vars.API_TOKEN }}
          # 连续 3 次被拒（5025/2014/网络错误）→ 自动换出口 IP
          EGRESS_ROTATE_AFTER: "3"
          EGRESS_ROTATOR: "ur_socks"
          REST_EVERY: ${{ inputs.rest_every }}
          REST_SEC: ${{ inputs.rest_sec }}
        run: |
          python warmup.py
          python run_ruyi.py

      - name: 加密账号目录
        if: always()
        shell: bash
        env:
          ARTIFACT_PASS: ${{ secrets.artifact_pass }}
        run: |
          if [ -d accounts ] && [ -n "$(ls -A accounts 2>/dev/null)" ]; then
            if [ -n "$ARTIFACT_PASS" ]; then
              tar -czf accounts.tar.gz accounts logs 2>/dev/null || tar -czf accounts.tar.gz accounts
              openssl enc -aes-256-cbc -pbkdf2 -salt -in accounts.tar.gz -out accounts.tar.gz.enc -pass "pass:$ARTIFACT_PASS"
              rm -f accounts.tar.gz
              echo "encrypted: accounts.tar.gz.enc"
            else
              echo "::warning::未配置 artifact_pass，账号不会上传（避免公开泄露）"
            fi
          else
            echo "no accounts produced"
          fi

      - name: 上传加密产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ur-accounts-run${{ matrix.run }}-${{ github.run_id }}
          path: |
            accounts.tar.gz.enc
            logs/
            ur-socks-*.log
            ur_accounts.jsonl
          retention-days: 14
          if-no-files-found: warn
