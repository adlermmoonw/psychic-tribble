name: twreg-public

# 放在【公开仓库】里跑的入口：用 secrets.gh_token 拉取私有仓库代码，然后执行注册。
#
# 公开仓库的日志与 artifact 是公开的，所以这里：
#   * LOG_MASK=1        —— 日志里的用户名打码
#   * accounts 目录加密  —— 用 secrets.artifact_pass 加密后才上传（未配置则完全不上传）
#
# 需要在公开仓库配置的 secrets：
#   gh_token       必填，能读私有仓库的 PAT（classic: repo；fine-grained: Contents=Read）
#   artifact_pass  选填，加密 accounts 的密码（强烈建议配置）
#   UR_CREDENTIALS 选填，仅当 egress=ur 时需要
#
# 需要按需修改的变量（本文件顶部）：
#   PRIVATE_REPO   私有仓库，形如 xbox-cn/twreg_ruyijs
#   PRIVATE_REF    拉取的分支/标签
on:
  workflow_dispatch:
    inputs:
      runners:
        description: "并行 runner 数（每台 1 条 WARP 出口）"
        required: false
        default: "1"
      workers:
        description: "线程数"
        required: false
        default: "3"
      accounts:
        description: "每个线程注册账号数"
        required: false
        default: "15"
      domain:
        description: "收信域名（*.xxx 表示每次随机子域）"
        required: false
        default: "*.jsip.us"
      warp_core:
        description: "WARP 协议: awg / wg / masque / masque-h2"
        required: false
        default: "awg"
      warp_nodes:
        description: "WARP edge colo 池（同区低延迟、每台不同 colo → 不同出口 IP）；非空时优先于国家"
        required: false
        default: ""
      warp_countries:
        description: "WARP 出口国家池（按 runner 轮流分配，避免多台撞同一出口 IP）"
        required: false
        default: ""
      rest_every:
        description: "每注册 N 个账号休息一次（0=不休息）"
        required: false
        default: "0"
      rest_sec:
        description: "每次休息秒数"
        required: false
        default: "600"
      upload:
        description: "上传账号到服务器: 1=上传 0=只加密上传 artifact"
        required: false
        default: "0"

concurrency:
  group: twreg-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          N: ${{ inputs.runners }}
        run: |
          M=$(python3 -c "import json,os;n=max(1,min(50,int(os.environ.get('N') or 1)));print(json.dumps(list(range(n))))")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  reg:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 公开日志：用户名打码
      LOG_MASK: "1"
    steps:
      - name: 检出私有仓库代码
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/twreg_ruyijs   # ← 改成你的私有仓库
          ref: feat/urnetwork-egress                          # ← 改成要拉的分支
          token: ${{ secrets.gh_token }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruyijs==0.2.0"
          python -c "import ruyijs; print('ruyijs', ruyijs.__version__)"

      - name: 缓存 xehn 包
        uses: actions/cache@v4
        with:
          path: xehn-cache
          key: xehn-cache-v1

      - name: 建立出口并注册（脚本在私有仓库，逻辑改动无需改这里）
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_INDEX: ${{ matrix.run }}
          WARP_NODES: ${{ inputs.warp_nodes }}
          WARP_COUNTRIES: ${{ inputs.warp_countries }}
          WORKERS: ${{ inputs.workers }}
          ACCOUNTS: ${{ inputs.accounts }}
          MAIL_API_URL: ${{ vars.MAIL_API_URL || 'https://mail.minecraft.fashion' }}
          MAIL_DOMAINS: ${{ inputs.domain }}
          ENABLE_UPLOAD: ${{ inputs.upload }}
          EGRESS_ROTATOR: "warp"
          EGRESS_ROTATE_AFTER: "3"
          REST_EVERY: ${{ inputs.rest_every }}
          REST_SEC: ${{ inputs.rest_sec }}
        run: |
          ./scripts/run_all.ps1 -Core "${{ inputs.warp_core }}" -Port 7890

      - name: 加密账号目录
        if: always()
        shell: bash
        env:
          ARTIFACT_PASS: ${{ secrets.artifact_pass }}
        run: |
          if [ -d accounts ] && [ -n "$(ls -A accounts 2>/dev/null)" ]; then
            if [ -n "$ARTIFACT_PASS" ]; then
              tar -czf accounts.tar.gz accounts logs 2>/dev/null || tar -czf accounts.tar.gz accounts
              openssl enc -aes-256-cbc -pbkdf2 -salt -in accounts.tar.gz -out accounts.tar.gz.enc -pass "pass:$ARTIFACT_PASS"
              rm -f accounts.tar.gz
              echo "encrypted: accounts.tar.gz.enc"
            else
              echo "::warning::未配置 artifact_pass，账号不会上传（避免公开泄露）"
            fi
          else
            echo "no accounts produced"
          fi

      - name: 上传加密产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounts-run${{ matrix.run }}-${{ github.run_id }}
          path: |
            accounts.tar.gz.enc
            logs/
          retention-days: 14
          if-no-files-found: warn
